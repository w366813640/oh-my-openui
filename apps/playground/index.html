<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>oh-my-open-ui · playground</title>
    <!--
      Pre-React paint: read the saved theme synchronously so the first frame
      already has the right surface color. This eliminates the white flash
      between the Electron splash closing and the React shell mounting.
    -->
    <script>
      (function () {
        try {
          // Storage key must match `STORAGE_KEY` in @oh/ui theme provider.
          var stored = localStorage.getItem('oh-ui-theme');
          var prefers = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = stored === 'dark' || (stored === 'system' && prefers) || (!stored && prefers) ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.style.background = resolved === 'dark' ? '#252623' : '#FBF9F5';
        } catch (_) {
          /* localStorage may be unavailable in private mode; the renderer recovers. */
        }
      })();
    </script>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #FBF9F5; }
      [data-theme="dark"] html, html[data-theme="dark"], html[data-theme="dark"] body { background: #252623; }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
